<!doctype html>
<html lang="zh-CN" data-theme="light" data-q="kai">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f1e8" />
<title>时迹 · 我的时间账本</title>
<link rel="stylesheet" href="styles.css" />
<script>
/* 先把主题定下来再画第一帧：否则选了深色主题的人会看到一闪的浅色。
   这里只做一个极小的映射（旧值 light/dark → paper/night），逻辑以 app.js 为准。 */
(function () {
  try {
    var o = JSON.parse(localStorage.getItem('shiji.ledger.v1') || '{}');
    var t = (o.settings || {}).theme;
    if (t === 'dark') t = 'night';
    else if (t === 'light') t = 'paper';
    else if (!t || t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { }
})();
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">时</span>
    <span class="brand-text">时迹<em>时间账本</em></span>
  </div>
  <div class="now" id="nowClock"><b>--:--:--</b><span>正在加载</span></div>
  <nav class="topnav">
    <button class="ghost-btn" id="btnTheme" type="button" title="外观主题（八套配色）">◐<i>主题</i></button>
    <button class="ghost-btn" id="btnData" type="button" title="备份与数据">⇅<i>数据</i></button>
    <button class="ghost-btn" id="btnHelp" type="button" title="使用说明">?<i>说明</i></button>
  </nav>
</header>

<main class="wrap">
  <section class="hero">
    <div class="panel hero-card" id="heroCard"></div>
    <div class="poster" id="poster"></div>
  </section>

  <div class="cols">
    <div class="col-left">
      <section class="panel" id="timerPanel"></section>
      <section class="panel rhythm" id="rhythmPanel"></section>
    </div>
    <div class="col-right">
      <section class="panel">
        <header class="panel-head">
          <h2>今日分配</h2>
          <div class="panel-head-right">
            <span class="hint" id="boardHint"></span>
            <button class="ghost-btn small" id="btnAddCat" type="button">＋ 新类型</button>
          </div>
        </header>
        <div id="board"></div>
      </section>

      <section class="panel" id="statsPanel"></section>

      <section class="panel" id="journalPanel"></section>
    </div>
  </div>

  <footer class="foot">
    <span>数据只存在这台设备的浏览器里（localStorage），不上传任何服务器。</span>
    <span>建议每周点一次「数据 → 导出备份」。</span>
  </footer>
</main>

<dialog id="modal" class="modal"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
