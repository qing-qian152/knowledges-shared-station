name: Daily content

on:
  schedule:
    # 22:00 UTC = 北京时间次日 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "要生成的日期（YYYY-MM-DD，留空 = 今天）"
        required: false
        default: ""
      topic:
        description: "指定主题（序号 1-30，或主题里的词，留空 = 按天轮转）"
        required: false
        default: ""
      force:
        description: "覆盖已存在的当天内容"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate today's lesson
        env:
          API_KEY: ${{ secrets.DEEPSEEK_KNOWLEDGE_SHARE || secrets.DEEPSEEK_API_KEY }}
          MODEL: deepseek-chat
          TZ: Asia/Shanghai
          IN_DATE: ${{ inputs.date }}
          IN_TOPIC: ${{ inputs.topic }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -e
          ARGS=()
          [ -n "$IN_DATE" ] && ARGS+=(--date "$IN_DATE")
          [ -n "$IN_TOPIC" ] && ARGS+=(--topic "$IN_TOPIC")
          [ "$IN_FORCE" = "true" ] && ARGS+=(--force)
          echo "参数: ${ARGS[*]:-（无，按今天自动生成）}"
          node scripts/generate.mjs "${ARGS[@]}"

      - name: Commit
        run: |
          git config user.name  "daily-learn-bot"
          git config user.email "daily-learn-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "今天没有新内容，跳过提交"
          else
            git commit -m "content: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
