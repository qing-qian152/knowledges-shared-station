name: Daily content

on:
  schedule:
    # 22:00 UTC = 北京时间次日 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate today's lesson
        env:
          API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODEL: deepseek-chat
          TZ: Asia/Shanghai
        run: node scripts/generate.mjs

      - name: Commit
        run: |
          git config user.name  "daily-learn-bot"
          git config user.email "daily-learn-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "今天没有新内容，跳过提交"
          else
            git commit -m "content: $(date -u +%F)"
            git push
          fi
