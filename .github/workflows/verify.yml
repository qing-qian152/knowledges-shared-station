name: Verify

# 只做检查，不改文件、不提交。
# 内容由 agent 按 AGENTS.md 写、由 daytool.py 发布；这里负责"别让坏东西进来"：
#   语法 → 结构清单是否漂移 → 主题变量是否齐全 → 每期内容是否合格 → 生成物是否过期
# 任何一步红了，把改动修好再推，不要用 --no-verify 绕。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 语法检查（JS / MJS）
        run: |
          set -e
          for f in sw.js assets/*.js scripts/*.mjs; do
            node --check "$f"
            echo "ok  $f"
          done

      - name: 语法检查（Python）
        run: |
          set -e
          python -m py_compile scripts/daytool.py
          echo "ok  scripts/daytool.py"

      - name: 结构体检（清单是否漂移）
        run: node scripts/check-structure.mjs

      - name: 主题体检（配色 / 字体变量）
        run: node scripts/check-themes.mjs

      - name: 内容校验（全部已发布日期）
        run: python scripts/daytool.py check --all

      - name: 生成物是否过期
        # sitemap.xml / robots.txt / data/days/index.js / index.html 归档区都由脚本产出，
        # 手改或忘记 publish 就会落后于 data/。重跑一遍，有 diff 就说明没同步。
        run: |
          set -e
          python scripts/daytool.py site
          if ! git diff --quiet; then
            echo "::error::生成物与 data/ 不同步，请在本地跑 python scripts/daytool.py site 并提交结果"
            git --no-pager diff --stat
            exit 1
          fi
          echo "生成物与内容一致"
